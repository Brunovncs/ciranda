name: Release

# Push a tag like v4.0.1, matching the version in client/Cargo.toml, to build the Windows client
# and publish it as a release. The release carries ciranda-<version>-windows-x64.exe and its
# SHA-256, the two files the client's updater looks for (by their -windows-x64.exe ending, so
# Harmony 4.1.1 and earlier find them too); the notes are GitHub's list of what
# changed since the last tag. Nothing is signed by a vendor: SmartScreen warns on first launch.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against client/Cargo.toml
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in client/Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    # MSVC: libwebrtc ships built against the static CRT, which /.cargo/config.toml asks for.
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - name: Tests
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "ciranda-${{ needs.version.outputs.version }}-windows-x64.exe"
          New-Item -ItemType Directory ..\dist | Out-Null
          Copy-Item target\release\ciranda.exe "..\dist\$name"
          (Get-FileHash "..\dist\$name" -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File -Encoding ascii "..\dist\$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [version, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ciranda ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
