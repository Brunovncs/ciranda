name: Release

# Push a tag like v4.0.1, matching the version in client/Cargo.toml, to build the client and
# publish it as a release. For Windows the release carries the installer,
# ciranda-<version>-windows-x64-setup.exe, for people installing Ciranda, and
# ciranda-<version>-windows-x64.exe, the program alone, which the client's updater swaps in (found
# by its -windows-x64.exe ending, so Harmony 4.1.1 and earlier find it too); the same pair for
# Windows on Arm ends in -windows-arm64. Linux gets an AppImage, with the .zsync AppImageUpdate
# reads to update it, and macOS a .dmg holding one program for both Apple silicon and Intel. Each
# package carries LICENSE, THIRD_PARTY_NOTICES.md and THIRD_PARTY_LICENSES.txt, the crates'
# licences, written once by the licenses job. Each file has its SHA-256 beside it; the notes are
# GitHub's list of what changed since the last tag. Nothing is signed by a vendor: SmartScreen
# warns on first launch, and macOS asks for the app to be opened from its context menu (the app
# is signed with Ciranda's own certificate when the MACOS_SIGN_P12 secret holds one, so that
# macOS keeps its permissions from one release to the next; see the macos job).
# Run by hand (Actions, "Run workflow") it builds and packages everything for the version in
# client/Cargo.toml without publishing, to try the packaging before a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the publishing job may write; the build runs third-party actions and every crate's
# build script, so it gets a read-only token. Actions are pinned to commits for the same reason.
permissions:
  contents: read

# As in ci.yml, whose release-cache job builds these jobs' dependencies under the same keys.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the tag against client/Cargo.toml
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in client/Cargo.toml"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The licences of every crate in the program, from Cargo.lock, written once for all the
  # packages (see client/about.toml). cargo-about is downloaded from its release and checked
  # against a pinned hash, as in ci.yml; bump both together.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install
      - name: cargo-about
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-about.tar.gz" https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$HOME/.cargo/bin" --strip-components=1 cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about
      - name: Crate licences
        run: |
          cargo fetch --locked
          mkdir -p target
          cargo about generate --locked --fail -o target/THIRD_PARTY_LICENSES.txt about.hbs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: licenses
          path: client/target/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  # x64 and Arm, each built natively on its own runner: everything is built for its own
  # processor, libwebrtc included, and the program's name keeps the x64 updater from taking the
  # Arm one.
  windows:
    needs: [version, licenses]
    strategy:
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    name: windows (${{ matrix.arch }})
    # MSVC: libwebrtc ships built against the static CRT, which /.cargo/config.toml asks for.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The toolchain rust-toolchain.toml pins.
      - run: rustup toolchain install
      # Restores the release-profile cache ci.yml's release-cache job keeps on main; one saved
      # under a tag could only ever be restored by that tag, so nothing is saved here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: client
          # v1: caches saved before the libwebrtc download was pinned may hold an unverified copy,
          # which the build would take as already extracted.
          prefix-key: v1-rust
          shared-key: release
          save-if: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: licenses
          path: client/target
      # In the release profile, so they share every dependency with the build below and the
      # one cache. CI has already run them in the dev profile, debug assertions on.
      - name: Tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      # The exe about to be published, started headless (see self_test in src/main.rs). It is a
      # GUI program in release, which PowerShell neither waits for nor shows the output of when
      # started directly; Start-Process waits, and the output goes through files.
      - name: Self-test
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process target\release\ciranda.exe -ArgumentList '--self-test' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput self-test.out -RedirectStandardError self-test.err
          Get-Content self-test.out, self-test.err
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          $name = "ciranda-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.exe"
          New-Item -ItemType Directory ..\dist | Out-Null
          Copy-Item target\release\ciranda.exe "..\dist\$name"
          (Get-FileHash "..\dist\$name" -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File -Encoding ascii "..\dist\$name.sha256"
      # Inno Setup at one version, whatever the runner image comes with (the Arm one has none);
      # Chocolatey installs it where the image's would be.
      - name: Installer
        shell: pwsh
        run: |
          $inno = '6.7.1'
          $have = (choco list --exact innosetup --limit-output) -replace '^innosetup\|', ''
          if ($have -ne $inno) {
            choco install innosetup --version $inno --allow-downgrade --force --no-progress -y | Out-Null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp /DVersion=${{ needs.version.outputs.version }} /DBuild=target\release /DArch=${{ matrix.arch }} packaging\ciranda.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Not ending in -windows-x64.exe, which is how every updater since 4.0.0 finds the program.
          $setup = "ciranda-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe"
          (Get-FileHash "..\dist\$setup" -Algorithm SHA256).Hash.ToLower() + "  $setup" | Out-File -Encoding ascii "..\dist\$setup.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-windows-${{ matrix.arch }}
          path: dist/*

  # Ubuntu 22.04: the AppImage runs on systems with its glibc (2.35) or newer.
  linux:
    needs: [version, licenses]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # file for the AppImage tool, zsync for its .zsync, appstream so the AppStream metadata is
      # always checked (the AppImage tool skips that without appstreamcli).
      - uses: ./.github/actions/linux-build-deps
        with:
          extra: file zsync appstream
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: client
          prefix-key: v1-rust
          shared-key: release
          save-if: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: licenses
          path: client/target
      - name: Tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Self-test
        timeout-minutes: 5
        run: xvfb-run -a target/release/ciranda --self-test
      - name: AppImage
        run: packaging/linux/appimage.sh "${{ needs.version.outputs.version }}" target/release/ciranda ../dist
      # What went into the AppImage and what it takes from the system, in the log for when a
      # distribution can't start it; and none of the libraries appimage.sh leaves to the system.
      - name: Libraries in the AppImage
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/dist/ciranda-${{ needs.version.outputs.version }}-linux-x64.AppImage" --appimage-extract > /dev/null
          echo "Bundled:"
          find squashfs-root/usr/lib -name '*.so*' -printf '  %P\n' | sort
          echo "From the system:"
          ldd squashfs-root/usr/bin/ciranda | grep -v squashfs-root | sort
          ls -l squashfs-root/usr/share/doc/ciranda squashfs-root/usr/share/metainfo
          if find squashfs-root/usr/lib \( -name 'libglib-2.0.so*' -o -name 'libgio-2.0.so*' -o -name 'libgobject-2.0.so*' \) | grep .; then
            echo "GLib was bundled; appimage.sh should leave it to the system" >&2
            exit 1
          fi
          rm -rf squashfs-root
      - name: Self-test the AppImage
        timeout-minutes: 5
        run: xvfb-run -a ../dist/ciranda-${{ needs.version.outputs.version }}-linux-x64.AppImage --appimage-extract-and-run --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-linux-x64
          path: dist/*

  # Built twice, for Apple silicon and for Intel, and joined into one program with lipo, so one
  # .dmg serves every Mac. The runner is Apple silicon: the tests run there, and the self-tests
  # run the program natively and, under Rosetta, its Intel half.
  macos:
    needs: [version, licenses]
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: client
          prefix-key: v1-rust
          shared-key: release
          save-if: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: licenses
          path: client/target
      - name: Tests
        run: cargo test --release --locked --target aarch64-apple-darwin
      # For macOS 12.3 and later (MACOSX_DEPLOYMENT_TARGET in /.cargo/config.toml).
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/ciranda target/aarch64-apple-darwin/release/ciranda target/x86_64-apple-darwin/release/ciranda
          vtool -show-build target/universal/ciranda | grep -E 'architecture|minos' || true
      - name: Self-test
        timeout-minutes: 5
        run: target/universal/ciranda --self-test
      # The Intel half, which nothing else here runs. Rosetta is not always on the runner image.
      - name: Self-test under Rosetta
        timeout-minutes: 15
        run: |
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 target/universal/ciranda --self-test
      # Ciranda's own self-signed certificate, from the MACOS_SIGN_P12 secret (base64 of a
      # PKCS#12 with the certificate "Ciranda Self-Signed Code Signing" and its key) and
      # MACOS_SIGN_P12_PASSWORD, in a keychain made for this job. bundle.sh signs with it; with no
      # secret (a fork) it signs ad-hoc, as before.
      - name: Signing identity
        id: identity
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGN_P12" ]; then
            echo "::warning::No MACOS_SIGN_P12 secret: the app is signed ad-hoc, and macOS will ask for the microphone, camera and screen again after this update."
            exit 0
          fi
          keychain="$RUNNER_TEMP/ciranda-signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          # codesign may use the key without a prompt nobody would answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # the existing keychains, one per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Not -v: a self-signed certificate is not trusted by the system, which codesign doesn't need.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/"Ciranda Self-Signed Code Signing"/ { print $2; exit }')
          if [ -z "$identity" ]; then
            security find-identity -p codesigning "$keychain"
            echo "MACOS_SIGN_P12 holds no \"Ciranda Self-Signed Code Signing\" identity" >&2
            exit 1
          fi
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: App and disk image
        env:
          CIRANDA_SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: packaging/macos/bundle.sh "${{ needs.version.outputs.version }}" target/universal/ciranda ../dist
      # Both halves of the signed program, under the hardened runtime it now runs with.
      - name: Self-test the app in the disk image
        timeout-minutes: 5
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/ciranda-dmg ../dist/ciranda-${{ needs.version.outputs.version }}-macos-universal.dmg
          status=0
          /tmp/ciranda-dmg/Ciranda.app/Contents/MacOS/ciranda --self-test || status=$?
          arch -x86_64 /tmp/ciranda-dmg/Ciranda.app/Contents/MacOS/ciranda --self-test || status=$?
          hdiutil detach /tmp/ciranda-dmg || true
          exit $status
      - name: Remove the signing keychain
        if: always() && steps.identity.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-macos
          path: dist/*

  publish:
    needs: [version, windows, linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The packages only; the licences file is already inside each of them.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ciranda ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
