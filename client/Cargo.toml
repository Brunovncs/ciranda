[package]
name = "ciranda"
description = "Ciranda desktop client: voice, screen sharing and text chat for a group of friends"
version = "4.3.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Pedro Lucas Miguel"]

[[bin]]
name = "ciranda"
path = "src/main.rs"

[dependencies]
# GPUI as published by the gpui-kit maintainers (`gpui-pre-*` snapshots of Zed). Pinned exactly:
# its API moves with Zed.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit"] }
# LiveKit's bindings to Google's libwebrtc: peer connections, the audio processing module (echo
# cancellation, noise suppression), desktop capture and libyuv.
libwebrtc = "0.3.51"

anyhow = "1"
async-channel = "2"
# End-to-end encryption of private conversations (core/crypto.rs): X25519 to agree a key with the
# other person, HKDF-SHA256 to derive from it, XChaCha20-Poly1305 to seal. RustCrypto and dalek,
# audited, nothing hand-rolled.
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18"
dirs = "7"
emojis = "0.9"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
log = "0.4"
mimalloc = { version = "0.1", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }
parking_lot = "0.12"
# The window's HWND, to hide it to the notification area. Already in the tree through GPUI.
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "charset", "http2"] }
# The speakers' end of each stream's queue: the output callback never waits on a lock for it.
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "ogg", "vorbis", "flac", "pcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tract-onnx = "0.23"
unicode-segmentation = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[build-dependencies]
embed-resource = "3"

# GPUI with video surfaces on Windows: YUV frames drawn and scaled by the GPU. What changed from
# the published 0.3.7 is listed in vendor/GPUI_VENDORED.md.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# webrtc-sys with a Media Foundation H.264 encoder on Windows (vendor/webrtc-sys/VENDORED.md).
webrtc-sys = { path = "vendor/webrtc-sys" }

[profile.dev.package."*"]
# Media code is unusable unoptimised: decoding, scaling and segmentation run every frame.
opt-level = 2
# Full debug info for dependencies made target/ tens of GB; backtraces only need line tables.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo build --profile local`: a release build for machines without fxc.exe. GPUI's Windows
# backend precompiles its shaders in release builds; with debug assertions on for that one crate
# it compiles them at startup instead.
[profile.local]
inherits = "release"

[profile.local.package.gpui-pre-windows]
debug-assertions = true

[profile.local.build-override]
debug-assertions = true
