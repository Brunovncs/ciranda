[package]
name = "ciranda"
description = "Ciranda desktop client: voice, screen sharing and text chat for a group of friends"
version = "4.6.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Pedro Lucas Miguel"]

[[bin]]
name = "ciranda"
path = "src/main.rs"

[dependencies]
# GPUI as published by the gpui-kit maintainers (`gpui-pre-*` snapshots of Zed). Pinned exactly:
# its API moves with Zed.
gpui = { package = "gpui-pre", version = "=0.3.7" }
# x11 and wayland only reach the Linux backend; Windows and macOS build without them.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "wayland", "x11"] }
# LiveKit's bindings to Google's libwebrtc: peer connections, the audio processing module (echo
# cancellation, noise suppression), desktop capture and libyuv.
libwebrtc = "0.3.51"

anyhow = "1"
async-channel = "2"
# End-to-end encryption of private conversations (core/crypto.rs): X25519 to agree a key with the
# other person, HKDF-SHA256 to derive from it, XChaCha20-Poly1305 to seal. RustCrypto and dalek,
# audited, nothing hand-rolled.
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `realtime`: the device threads ask for real-time scheduling (MMCSS on Windows; ALSA's on Linux,
# where the PulseAudio host below runs its own).
cpal = { version = "0.18", features = ["realtime"] }
dirs = "7"
emojis = "0.9"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
log = "0.4"
mimalloc = { version = "0.1", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
parking_lot = "0.12"
# The window's HWND, to hide it to the notification area. Already in the tree through GPUI.
raw-window-handle = "0.6"
# TLS is rustls with ring, checked against the system's certificate store (rustls-platform-verifier,
# as a browser does), for HTTP and the socket alike; see `core::api::tls`. No OpenSSL to ship on
# Linux, and no cmake or nasm to build aws-lc on every runner.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# The speakers' end of each stream's queue: the output callback never waits on a lock for it.
rtrb = "0.3"
# Band-limited (windowed sinc) resampling between 48 kHz and whatever rate a device runs at; the
# FFT resampler is left out, so it brings no FFT library.
rubato = { version = "5.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "ogg", "vorbis", "flac", "pcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["__rustls-tls"] }
tract-onnx = "0.23"
# DeepFilterNet's streaming nets run pulsed, one 10 ms frame at a time (media/deepfilter.rs), and
# its STFT is a real FFT.
tract-pulse = "0.23"
realfft = "3"
unicode-segmentation = "1"
url = "2"

# Cameras through each system's own capture API.
[target.'cfg(windows)'.dependencies.nokhwa]
version = "0.10"
default-features = false
features = ["input-msmf"]

[target.'cfg(target_os = "macos")'.dependencies]
sys-locale = "0.3"
# Global hotkeys: Carbon's RegisterEventHotKey, which needs no Accessibility permission.
global-hotkey = "0.9"
keyboard-types = "0.8"
# The key that seals secrets at rest, kept in the login keychain. Already in the tree through the
# certificate verifier.
security-framework = "3"
# The camera's own list of modes: nokhwa's filters it wrongly on macOS (media/camera.rs). The same
# version nokhwa uses.
nokhwa-bindings-macos = "0.2.4"
# App Nap held off during a call, and the share's sound through a Core Audio process tap. The
# versions cpal already brings.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSProcessInfo", "NSString", "NSUUID", "NSValue"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3"

[target.'cfg(target_os = "macos")'.dependencies.nokhwa]
version = "0.10"
default-features = false
features = ["input-avfoundation"]

[target.'cfg(target_os = "linux")'.dependencies.nokhwa]
version = "0.10"
default-features = false
features = ["input-v4l"]

[target.'cfg(target_os = "linux")'.dependencies]
# Global hotkeys: XGrabKey over x11rb (pure Rust, already in the tree through GPUI).
global-hotkey = "0.9"
keyboard-types = "0.8"
# The key that seals secrets at rest, kept in the Secret Service (GNOME Keyring, KWallet) over
# zbus: pure Rust, so the AppImage needs no libdbus. The same crate and features as GPUI's own.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
# PulseAudio (and PipeWire through pipewire-pulse) before ALSA: devices by their own names, and each
# sink's monitor for a share's sound. A pure-Rust client of the protocol, so nothing to install.
cpal = { version = "0.18", features = ["pulseaudio"] }
# Wayland screen sharing goes through the desktop portal, whose D-Bus replies need a GLib main
# loop running.
libwebrtc = { version = "0.3.51", features = ["glib-main-loop"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[dev-dependencies]
# The macOS and Linux hotkeys' key codes, so their mapping is tested on every platform.
keyboard-types = "0.8"

[build-dependencies]
embed-resource = "3"

# GPUI with video surfaces on Windows and macOS: YUV frames drawn and scaled by the GPU. What
# changed from the published 0.3.7 is listed in vendor/GPUI_VENDORED.md.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
# webrtc-sys with a Media Foundation H.264 encoder on Windows (vendor/webrtc-sys/VENDORED.md).
webrtc-sys = { path = "vendor/webrtc-sys" }

[profile.dev.package."*"]
# Media code is unusable unoptimised: decoding, scaling and segmentation run every frame.
opt-level = 2
# Full debug info for dependencies made target/ tens of GB; backtraces only need line tables.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo build --profile local`: a release build for machines without fxc.exe. GPUI's Windows
# backend precompiles its shaders in release builds; with debug assertions on for that one crate
# it compiles them at startup instead.
[profile.local]
inherits = "release"

[profile.local.package.gpui-pre-windows]
debug-assertions = true

[profile.local.build-override]
debug-assertions = true
